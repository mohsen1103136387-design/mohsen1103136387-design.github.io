<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>چک‌لیست ۶۰ روزه</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;padding-bottom:90px}
header{position:sticky;top:0;background:#1e293b;padding:12px 16px;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.4)}
h1{font-size:17px;color:#7dd3fc;margin-bottom:8px}
.bar{background:#334155;height:12px;border-radius:8px;overflow:hidden}
.fill{background:linear-gradient(90deg,#22c55e,#4ade80);height:100%;width:0%;transition:width .4s;border-radius:8px}
.stat{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{background:#334155;padding:4px 10px;border-radius:12px;font-size:12px}
.chip b{color:#4ade80}
.tools{display:flex;gap:8px;margin-top:8px}
.btn{background:#334155;border:none;color:#e2e8f0;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}
.btn.on{background:#22c55e;color:#052e16}
.btn.danger{background:#7f1d1d}
.week{margin:14px 12px;background:#1e293b;border-radius:12px;overflow:hidden}
.whead{background:#2874a6;padding:10px 14px;font-weight:bold;cursor:pointer}
.wtop{display:flex;justify-content:space-between;align-items:center}
.wtop span{font-size:12px;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:10px}
.wbar{background:rgba(0,0,0,.3);height:5px;border-radius:4px;margin-top:8px;overflow:hidden}
.wfill{background:#4ade80;height:100%;width:0%;transition:width .4s}
.wbody{display:none}
.week.open .wbody{display:block}
.day{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #334155;cursor:pointer}
.day:last-child{border-bottom:none}
.day input{width:26px;height:26px;accent-color:#22c55e;cursor:pointer;flex-shrink:0}
.txt{flex:1}
.num{font-weight:bold;color:#7dd3fc;font-size:12px}
.code{font-size:14px;display:block}
.eng{font-size:12px;color:#94a3b8;display:block;margin-top:2px}
.day.done{background:rgba(34,197,94,.08)}
.day.done .code,.day.done .eng{text-decoration:line-through;opacity:.45}
.day.next{border:2px solid #f59e0b;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.4)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}
.hide-done .day.done{display:none}
.fab{position:fixed;bottom:18px;right:16px;background:#2874a6;color:#fff;border:none;padding:14px 18px;border-radius:30px;font-size:14px;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:20}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#22c55e;color:#052e16;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:bold;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.show{opacity:1}
#party{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;justify-content:center;align-items:center;text-align:center;font-size:22px;color:#4ade80;padding:20px}
</style>
</head>
<body>
<header>
<h1>🗺️ چک‌لیست سفر ۶۰ روزه</h1>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="stat">
<span class="chip">پیشرفت: <b id="pct">0%</b></span>
<span class="chip">✅ <b id="cnt">0</b>/56</span>
<span class="chip">🔥 پیوسته: <b id="stk">0</b></span>
</div>
<div class="tools">
<button class="btn" id="flt" onclick="toggleFilter()">🔍 فقط انجام‌نشده‌ها</button>
<button class="btn danger" onclick="resetAll()">🗑 شروع دوباره</button>
</div>
</header>
<div id="app"></div>
<button class="fab" onclick="goNext()">➜ روز بعدی</button>
<div id="toast"></div>
<div id="party">🎉🎊<br>تبریک!<br>کل برنامه رو تموم کردی!<br>تو حالا یک برنامه‌نویس واقعی هستی! 🏆</div>
<script>
const W=[
{t:"هفتهٔ ۱: HTML/CSS + لغات پایه",d:[[1,"تگ‌های HTML (h1-h6, p, div, img)","۲۰ لغت + پادکست"],[2,"لینک و لیست (a, ul, li)","گرامر I am / You are"],[3,"CSS پایه (color, font)","نوشتن ۵ جمله"],[4,"Box Model (margin, padding)","گرامر This / That"],[5,"تمرین: کارت محصول","داستان کوتاه A1"],[6,"مرور هفته + رفع اشکال","نوشتن ۱۰ جمله"],[7,"☕ استراحت","🎬 فیلم با زیرنویس"]]},
{t:"هفتهٔ ۲: CSS پیشرفته + گذشته",d:[[8,"Flexbox پایه","گرامر گذشته (was/were)"],[9,"تمرین Flexbox (۳ ستون)","جملات گذشته"],[10,"CSS Grid پایه","خبر ساده انگلیسی"],[11,"تمرین Grid (گالری)","جملات سوالی"],[12,"Responsive (media query)","نوشتن دربارهٔ روز"],[13,"پروژه: صفحهٔ پروفایل","ویرایش متن"],[14,"☕ استراحت","🎬 سریال"]]},
{t:"هفتهٔ ۳: JavaScript مقدماتی",d:[[15,"متغیرها (let, const)","گرامر آینده (will)"],[16,"انواع داده","جملات آینده"],[17,"عملگرها (+ - * /)","متن کوتاه"],[18,"شرط‌ها (if/else)","جملات شرطی"],[19,"تمرین: برنامهٔ سن‌سنج","۱۰ جمله شرطی"],[20,"مرور + رفع اشکال","مرور گرامر"],[21,"☕ استراحت","🎬 فیلم"]]},
{t:"هفتهٔ ۴: توابع + حلقه‌ها",d:[[22,"توابع (function)","حروف اضافه (in/on/at)"],[23,"تمرین: ماشین حساب","تمرین حروف اضافه"],[24,"حلقهٔ for","داستان کوتاه"],[25,"حلقهٔ while","پاراگراف ۷ جمله‌ای"],[26,"آرایه‌ها (Array)","گرامر مقایسه‌ای"],[27,"پروژه: ماشین حساب کامل","نوشتن دربارهٔ پروژه"],[28,"🎉 جشن ماه اول","📊 تست سطح زبان"]]},
{t:"هفتهٔ ۵: DOM + لغات تکنولوژی",d:[[29,"DOM و querySelector","مقالهٔ ساده"],[30,"تغییر متن (textContent)","تمرین گرامر"],[31,"تغییر استایل (style)","نوشتن دربارهٔ DOM"],[32,"Event Listener (click)","مستندات انگلیسی"],[33,"تمرین: دکمه‌های رنگی","گرامر مجهول"],[34,"مرور + رفع اشکال","مرور لغات"],[35,"☕ استراحت","🎬 فیلم"]]},
{t:"هفتهٔ ۶: پروژهٔ Todo List",d:[[36,"شروع Todo (HTML)","گرامر حال کامل"],[37,"استایل Todo (CSS)","تمرین گرامر"],[38,"اضافه کردن آیتم (JS)","مقاله"],[39,"حذف آیتم","نوشتن دربارهٔ پروژه"],[40,"LocalStorage","گرامر شرطی نوع ۲"],[41,"تکمیل + باگ‌گیری","مرور لغات"],[42,"☕ استراحت","🎬 فیلم"]]},
{t:"هفتهٔ ۷: API",d:[[43,"مفهوم API و fetch","مستندات API"],[44,"تمرین fetch","گرامر نقل قول"],[45,"JSON و نمایش داده","تمرین گرامر"],[46,"پروژه: اپ آب و هوا","نوشتن دربارهٔ API"],[47,"ادامهٔ پروژه + استایل","مقالهٔ تکنولوژی"],[48,"تکمیل + باگ‌گیری","مرور گرامر"],[49,"☕ استراحت","🎬 فیلم"]]},
{t:"هفتهٔ ۸: GitHub + پایان سفر",d:[[50,"ساخت GitHub + Git پایه","مطالعهٔ GitHub"],[51,"آپلود پروژه","README انگلیسی"],[52,"GitHub Pages (انتشار)","تمرین گرامر"],[53,"انتشار پروژه‌های قبلی","نوشتن دربارهٔ GitHub"],[54,"مرور کل دوره","📊 تست سطح زبان"],[55,"پروژهٔ نهایی دلخواه","مرور لغات"],[56,"🎉 جشن پایان","📊 مقایسهٔ سطح"]]}
];
let S=JSON.parse(localStorage.getItem('plan60')||'{}');
const app=document.getElementById('app');
W.forEach((w,wi)=>{
  const sec=document.createElement('div');sec.className='week';sec.dataset.w=wi;
  sec.innerHTML='<div class="whead" onclick="this.parentNode.classList.toggle(\'open\')"><div class="wtop">'+w.t+'<span></span></div><div class="wbar"><div class="wfill"></div></div></div><div class="wbody"></div>';
  const body=sec.querySelector('.wbody');
  w.d.forEach(([n,c,e])=>{
    const l=document.createElement('label');l.className='day';l.dataset.n=n;
    l.innerHTML='<input type="checkbox" '+(S[n]?'checked':'')+'><div class="txt"><span class="num">روز '+n+'</span><span class="code">💻 '+c+'</span><span class="eng">🌍 '+e+'</span></div>';
    l.querySelector('input').onchange=ev=>{
      const on=ev.target.checked;
      if(on){S[n]=true;vib();toast('✅ آفرین! روز '+n+' تکمیل شد');}else{delete S[n];toast('↩️ روز '+n+' برگشت');}
      save();
      const wd=sec.querySelectorAll('.day').length, dn=sec.querySelectorAll('.day.done').length;
      if(on&&dn===wd)toast('🎉 عالی! کل '+w.t+' تمام شد!');
    };
    body.appendChild(l);
  });
  app.appendChild(sec);
});
function save(){localStorage.setItem('plan60',JSON.stringify(S));draw();}
function vib(){if(navigator.vibrate)navigator.vibrate(30);}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
function toggleFilter(){const b=document.getElementById('flt');const on=document.body.classList.toggle('hide-done');b.classList.toggle('on',on);}
function streak(){let best=0,cur=0;for(let i=1;i<=56;i++){if(S[i]){cur++;if(cur>best)best=cur;}else cur=0;}return best;}
function draw(){
  let c=0;document.querySelectorAll('.day').forEach(d=>{const on=!!S[d.dataset.n];d.classList.toggle('done',on);d.classList.remove('next');if(on)c++;});
  document.querySelectorAll('.week').forEach(w=>{const t=w.querySelectorAll('.day').length,dn=w.querySelectorAll('.day.done').length;w.querySelector('.wtop span').textContent=dn+'/'+t;w.querySelector('.wfill').style.width=(dn/t*100)+'%';});
  const nx=document.querySelector('.day:not(.done)');if(nx)nx.classList.add('next');
  const p=Math.round(c/56*100);
  document.getElementById('fill').style.width=p+'%';
  document.getElementById('pct').textContent=p+'%';
  document.getElementById('cnt').textContent=c;
  document.getElementById('stk').textContent=streak();
  document.getElementById('party').style.display=(c===56)?'flex':'none';
}
function goNext(){const nx=document.querySelector('.day:not(.done)');if(!nx){toast('🏆 همه رو تموم کردی!');return;}
  const wk=nx.closest('.week');wk.classList.add('open');
  nx.scrollIntoView({behavior:'smooth',block:'center'});}
function resetAll(){if(confirm('مطمئنی همهٔ تیک‌ها پاک بشن؟')){S={};save();}}
// باز کردن خودکار هفتهٔ فعال
(function(){for(const w of document.querySelectorAll('.week')){if(w.querySelector('.day:not(.done)')){w.classList.add('open');break;}}})();
draw();
</script>
</body>
</html>
