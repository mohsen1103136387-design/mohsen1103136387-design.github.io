<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>چک‌لیست ۶۰ روزه</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;padding-bottom:90px}
header{position:sticky;top:0;background:#1e293b;padding:12px 16px;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.4)}
h1{font-size:17px;color:#7dd3fc;margin-bottom:8px}
.bar{background:#334155;height:12px;border-radius:8px;overflow:hidden}
.fill{background:linear-gradient(90deg,#22c55e,#4ade80);height:100%;width:0%;transition:width .4s}
.stat{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{background:#334155;padding:4px 10px;border-radius:12px;font-size:12px}
.chip b{color:#4ade80}
.tools{display:flex;gap:8px;margin-top:8px}
.btn{background:#334155;border:none;color:#e2e8f0;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}
.btn.on{background:#22c55e;color:#052e16}
.btn.danger{background:#7f1d1d}
.week{margin:14px 12px;background:#1e293b;border-radius:12px;overflow:hidden}
.whead{background:#2874a6;padding:10px 14px;font-weight:bold;cursor:pointer}
.wtop{display:flex;justify-content:space-between;align-items:center}
.wtop span{font-size:12px;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:10px}
.wbar{background:rgba(0,0,0,.3);height:5px;border-radius:4px;margin-top:8px;overflow:hidden}
.wfill{background:#4ade80;height:100%;width:0%;transition:width .4s}
.wbody{display:none}
.week.open .wbody{display:block}
.row{display:flex;align-items:stretch;border-bottom:1px solid #334155}
.dw:last-child .row{border-bottom:none}
.day{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;flex:1}
.day input{width:26px;height:26px;accent-color:#22c55e;cursor:pointer;flex-shrink:0}
.txt{flex:1}
.num{font-weight:bold;color:#7dd3fc;font-size:12px}
.code{font-size:14px;display:block}
.eng{font-size:12px;color:#94a3b8;display:block;margin-top:2px}
.info{background:#334155;border:none;color:#7dd3fc;font-size:16px;padding:0 14px;cursor:pointer;flex-shrink:0}
.dw.done .row{background:rgba(34,197,94,.08)}
.dw.done .code,.dw.done .eng{text-decoration:line-through;opacity:.45}
.dw.next .row{border:2px solid #f59e0b;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.4)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}
.detail{display:none;background:#0b1220;padding:12px 16px;font-size:13px;line-height:1.9;border-right:4px solid #2874a6}
.dw.open .detail{display:block}
.detail b{color:#7dd3fc}
.hide-done .dw.done{display:none}
.fab{position:fixed;bottom:18px;right:16px;background:#2874a6;color:#fff;border:none;padding:14px 18px;border-radius:30px;font-size:14px;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:20}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#22c55e;color:#052e16;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:bold;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.show{opacity:1}
#party{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;justify-content:center;align-items:center;text-align:center;font-size:22px;color:#4ade80;padding:20px}
</style>
</head>
<body>
<header>
<h1>🗺️ چک‌لیست سفر ۶۰ روزه</h1>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="stat">
<span class="chip">پیشرفت: <b id="pct">0%</b></span>
<span class="chip">✅ <b id="cnt">0</b>/56</span>
<span class="chip">🔥 پیوسته: <b id="stk">0</b></span>
</div>
<div class="tools">
<button class="btn" id="flt" onclick="toggleFilter()">🔍 فقط انجام‌نشده‌ها</button>
<button class="btn danger" onclick="resetAll()">🗑 شروع دوباره</button>
</div>
</header>
<div id="app"></div>
<button class="fab" onclick="goNext()">➜ روز بعدی</button>
<div id="toast"></div>
<div id="party">🎉<br>تبریک!<br>کل برنامه رو تموم کردی!<br>تو حالا یک برنامه‌نویس واقعی هستی! 🏆</div>

    const dw=document.createElement('div');dw.className='dw';dw.dataset.n=n;
    dw.innerHTML='<div class="row"><label class="day"><input type="checkbox" '+(ST[n]?'checked':'')+'><div class="txt"><span class="num">روز '+n+'</span><span class="code">💻 '+c+'</span><span class="eng">🌍 '+e+'</span></div></label><button class="info" onclick="this.closest(\'.dw\').classList.toggle(\'open\')">📖</button></div>'+
    '<div class="detail">'+TIME+'<br><b>💻 یعنی چی؟</b> '+desc+'<br><b>🎬 از کجا؟</b> '+src+'<br>'+eng+'</div>';
    dw.querySelector('input').onchange=ev=>{
      const on=ev.target.checked;
      if(on){ST[n]=true;if(navigator.vibrate)navigator.vibrate(30);toast('✅ آفرین! روز '+n+' تکمیل شد');}
      else{delete ST[n];toast('↩️ روز '+n+' برگشت');}
      save();
      const wd=sec.querySelectorAll('.dw').length,dn=sec.querySelectorAll('.dw.done').length;
      if(on&&dn===wd)toast('🎉 عالی! کل هفته تمام شد!');
    };
    body.appendChild(dw);
  });
  app.appendChild(sec);
});
function save(){localStorage.setItem('plan60',JSON.stringify(ST));draw();}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
function toggleFilter(){const b=document.getElementById('flt');const on=document.body.classList.toggle('hide-done');b.classList.toggle('on',on);}
function streak(){let best=0,cur=0;for(let i=1;i<=56;i++){if(ST[i]){cur++;if(cur>best)best=cur;}else cur=0;}return best;}
function draw(){
  let c=0;document.querySelectorAll('.dw').forEach(d=>{const on=!!ST[d.dataset.n];d.classList.toggle('done',on);d.classList.remove('next');if(on)c++;});
  document.querySelectorAll('.week').forEach(w=>{const t=w.querySelectorAll('.dw').length,dn=w.querySelectorAll('.dw.done').length;w.querySelector('.wtop span').textContent=dn+'/'+t;w.querySelector('.wfill').style.width=(dn/t*100)+'%';});
  const nx=document.querySelector('.dw:not(.done)');if(nx)nx.classList.add('next');
  const p=Math.round(c/56*100);
  document.getElementById('fill').style.width=p+'%';
  document.getElementById('pct').textContent=p+'%';
  document.getElementById('cnt').textContent=c;
  document.getElementById('stk').textContent=streak();
  document.getElementById('party').style.display=(c===56)?'flex':'none';
}
function goNext(){const nx=document.querySelector('.dw:not(.done)');if(!nx){toast('🏆 همه رو تموم کردی!');return;}nx.closest('.week').classList.add('open');nx.scrollIntoView({behavior:'smooth',block:'center'});}
function resetAll(){if(confirm('مطمئنی همهٔ تیک‌ها پاک بشن؟')){ST={};save();}}
(function(){for(const w of document.querySelectorAll('.week')){if(w.querySelector('.dw:not(.done)')){w.classList.add('open');break;}}})();
draw();
</script>
</body>
